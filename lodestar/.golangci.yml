version: '2'
linters:
  default: none
  enable:
    - asciicheck
    - bodyclose
    - copyloopvar
    - cyclop
    - depguard
    - dogsled
    - durationcheck
    - errcheck
    - errorlint
    - exhaustive
    - forcetypeassert
    - funlen
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godox
    - gomoddirectives
    - goprintffuncname
    - gosec
    - govet
    - importas
    - ineffassign
    - makezero
    - misspell
    - nakedret
    - nestif
    - nilerr
    - nlreturn
    - noctx
    - nolintlint
    - paralleltest
    - prealloc
    - predeclared
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - tagliatelle
    - tparallel
    - unconvert
    - unparam
    - wastedassign
    - whitespace
    - wrapcheck
  settings:
    cyclop:
      max-complexity: 25
    depguard:
      rules:
        main:
          files:
            - $all
          allow:
            - $gostd
            - cloud.google.com/go/civil
            - cloud.google.com/go/logging
            - cloud.google.com/go/spanner
            - github.com/impulseframework
            - github.com/go-chi/chi/v5
            - github.com/go-playground/errors/v5
            - github.com/go-playground/validator/v10
            - github.com/jtwatson/server
            - github.com/sethvargo/go-envconfig
            - github.com/shopspring/decimal
            - google.golang.org/api/iterator
            - google.golang.org/grpc/codes
            - github.com/spf13/cobra
    exhaustive:
      default-signifies-exhaustive: true
    funlen:
      lines: 100
      statements: 50
    gocognit:
      min-complexity: 50
    goconst:
      min-len: 2
      min-occurrences: 3
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    gocyclo:
      min-complexity: 25
    godox:
      keywords:
        - TODO
        - BUG
    misspell:
      locale: US
    nestif:
      min-complexity: 10
    tagalign:
      order:
        - json
        - spanner
    tagliatelle:
      case:
        rules:
          json: camel
        use-field-name: true
    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - .Cause(
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      - linters:
          - funlen
          - gochecknoglobals
          - gochecknoinits
          - goconst
          - gocyclo
          - mnd
          - nlreturn
          - scopelint
          - gocognit
          - cyclop
          - nestif
          # Test tables grow by appending generated cases to a literal of
          # handwritten ones; preallocation noise adds nothing in tests.
          - prealloc
        path: _test\.go
      # The regen test, the schema-warning test, and the audit test rewrite the working
      # tree and must not run in parallel.
      - linters:
          - paralleltest
          - tparallel
        path: cmd/generate/(generate|warnings|audit)_test\.go
      # Each test named here runs its cases one after another, because its cases work on
      # the same rows: one case reads a row that another case writes, or the test itself
      # reads or writes those rows between its cases or after them. A case that called
      # t.Parallel would wait until the test's function returned and then run beside the
      # others, in no order. The rule goes by the test's name, which both linters'
      # messages carry, so every other test of the package is held to t.Parallel in each
      # of its cases. A new test whose cases need their order is added here by name, one
      # file's tests to a line.
      - linters:
          - paralleltest
          - tparallel
        path: test/integration/
        text: "\\b(TestGeneratedIdentityOneTenantPerPerson|\
          TestGeneratedIdentitySectorRemovePassword|\
          TestGeneratedIdentitySectorAccountMethods|TestGeneratedIdentitySectorRoleMethods|TestGeneratedIdentitySectorIdentities|\
          TestImpersonationOperator|\
          TestConditionLanguageWrites|\
          TestDeleteCascade_takesWhatIsUnder|TestDeleteCascade_byAnotherColumnAndUnderItsOwnKind|TestDeleteCascade_anotherSectorsRowIsNotUnderARecord|\
          TestMethodRequestFieldsNoTarget|TestMethodRequestFieldsList|TestMethodRequestFieldsTarget|\
          TestRowsOfWrites|\
          TestSectorPilotsMethod|\
          TestWriteTenancy)\
          ('s subtests should call t\\.Parallel| missing the call to method parallel in )"
      # The request log suite redirects the standard logger, which the console exporter
      # writes through, to read each request's decision, so nothing else may write
      # through it meanwhile.
      - linters:
          - paralleltest
        path: test/integration/request_log_test\.go
      # So do the suites that read each mask denial in the log: they run on their own.
      - linters:
          - paralleltest
        path: test/integration/impersonation_(mask|access)_skipauth_test\.go
        text: TestImpersonationMask_((credential|access)Methods|creatingASector)
      # Lodestar is committed in the framework's own repository, so it builds against
      # the local source rather than a published version that cannot exist yet.
      - linters:
          - gomoddirectives
        path: go\.mod
        text: 'local replacement are not allowed: github\.com/impulseframework/impulse$'
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
