@if (core.isLoading()) {
  <mat-progress-bar color="primary" mode="indeterminate" class="progress"></mat-progress-bar>
}
<div class="alert-container" [class.framed]="framed()">
  <div class="alerts">
    @for (notification of notifications.notifications(); track notification.id) {
      <impulse-alert [error]="notification" />
    }
  </div>
</div>
<router-outlet (activate)="shown($event)"></router-outlet>
