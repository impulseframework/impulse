<h2 mat-dialog-title>Create your tenant</h2>
<form [formGroup]="form" (ngSubmit)="create()">
  <mat-dialog-content>
    <p>
      You are signed in and hold no tenant. Name yours: you become its administrator the moment it exists, and it is
      yours to invite people into.
    </p>
    <mat-form-field appearance="outline" class="field" subscriptSizing="dynamic">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" name="name" autocomplete="organization" placeholder="West" />
      <mat-hint>What people call the tenant, wherever it is listed. It can be changed later.</mat-hint>
    </mat-form-field>
    @if (error()) {
      <p class="refusal" role="alert">{{ error() }}</p>
    }
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close>Cancel</button>
    <button mat-flat-button type="submit" [disabled]="form.invalid || busy()">Create tenant</button>
  </mat-dialog-actions>
</form>
