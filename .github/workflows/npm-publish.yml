name: npm publish

# Publishes the three browser packages a release carries. release-please cuts one release of
# this repository (tag vX.Y.Z) and moves the packages' versions with it (the extra-files of
# release-please-config.json), so a release publishes @impulseframework/resource,
# @impulseframework/resource-angular and @impulseframework/resource-firestore at the
# framework's version, from the release's tag, in the order the packages depend on each
# other. The manual trigger re-publishes a tag after a fixed registry setting.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, e.g. v0.1.0'
        required: true
        type: string

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      # The bun that wrote web/bun.lock.
      BUN_VERSION: 1.4.4
    steps:
      - name: Resolve the version from the tag
        id: release
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a release tag (vX.Y.Z)"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # a release build installs from the lockfile, never from a cache
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Trusted publishing needs the npm that ships it, which is newer than the one Node carries.
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run build
        working-directory: web

      - name: The built manifests carry the released version
        # Every package is checked before any is published, so a mismatch publishes nothing.
        working-directory: web
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          for name in resource resource-angular resource-firestore; do
            built=$(node -p "require('./dist/$name/package.json').version")
            if [ "$built" != "$VERSION" ]; then
              echo "::error::dist/$name is $built, the tag says $VERSION"
              exit 1
            fi
            echo "dist/$name: $built"
          done

      # Authentication is OIDC trusted publishing: each package's settings on npmjs.com name this
      # workflow file as a trusted publisher, and npm exchanges the job's identity token for a
      # short-lived publish credential. A package name that does not exist yet cannot be created
      # this way (nor by a token or a staged publish), so a person claimed each name once by
      # publishing a placeholder at 0.0.0 with two-factor authentication; every release is
      # published by this workflow.
      # resource first: the other two name it as an exact peer dependency.
      - name: Publish @impulseframework/resource
        run: npm publish --access public --provenance
        working-directory: web/dist/resource
      - name: Publish @impulseframework/resource-angular
        run: npm publish --access public --provenance
        working-directory: web/dist/resource-angular
      - name: Publish @impulseframework/resource-firestore
        run: npm publish --access public --provenance
        working-directory: web/dist/resource-firestore
