<h2 mat-dialog-title class="impulse-action-title">{{ data.title }}</h2>
<form class="impulse-action-form" (ngSubmit)="confirm()">
  <mat-dialog-content class="impulse-action-content">
    @if (data.words; as words) {
      <p class="impulse-action-words">{{ words }}</p>
    }
    @if (data.field; as field) {
      <mat-form-field appearance="outline" class="impulse-action-field" subscriptSizing="dynamic">
        <mat-label>{{ field.label }}</mat-label>
        <input
          matInput
          name="value"
          [type]="field.type ?? 'text'"
          [(ngModel)]="value"
          [attr.autocomplete]="field.autocomplete ?? 'off'"
          [attr.maxlength]="field.maxLength ?? null"
          required />
      </mat-form-field>
    }
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" class="impulse-action-cancel" (click)="cancel()">Cancel</button>
    <button mat-flat-button type="submit" class="impulse-action-confirm" [disabled]="!ready()">{{ data.confirm }}</button>
  </mat-dialog-actions>
</form>
