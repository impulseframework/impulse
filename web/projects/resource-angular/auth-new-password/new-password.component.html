<mat-form-field appearance="outline" subscriptSizing="dynamic" class="impulse-new-password-field">
  <mat-label>{{ label() }}</mat-label>
  <input
    matInput
    class="impulse-new-password-box"
    name="newPassword"
    [type]="shown() ? 'text' : 'password'"
    [(ngModel)]="password"
    autocomplete="new-password"
    required />
  <button
    matSuffix
    mat-icon-button
    type="button"
    class="impulse-new-password-show"
    [attr.aria-label]="shown() ? 'Hide the password' : 'Show the password'"
    [attr.aria-pressed]="shown()"
    (click)="toggleShown()">
    <mat-icon>{{ shown() ? 'visibility_off' : 'visibility' }}</mat-icon>
  </button>
</mat-form-field>
<div
  class="impulse-new-password-meter"
  [class.impulse-new-password-short]="tone() === 'short'"
  [class.impulse-new-password-near]="tone() === 'near'"
  [class.impulse-new-password-enough]="tone() === 'enough'">
  <div
    class="impulse-new-password-track"
    role="meter"
    aria-label="Password strength"
    aria-valuemin="0"
    aria-valuemax="100"
    [attr.aria-valuenow]="fill()">
    <div class="impulse-new-password-fill" [style.width.%]="fill()"></div>
    @if (markAt() !== undefined) {
      <div class="impulse-new-password-mark" [style.left.%]="markAt()"></div>
    }
  </div>
  <div class="impulse-new-password-mark-word">
    @if (markAt() !== undefined) {
      <span [style.left.%]="markAt()">needed here</span>
    }
  </div>
  <div class="impulse-new-password-say" role="status">{{ sentence() }}</div>
</div>
