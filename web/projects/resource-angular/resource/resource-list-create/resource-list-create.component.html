@if (config().collapsible) {
  <div class="page-container">
    <mat-expansion-panel
      #expPanel
      [@.disabled]="true"
      disabled="{{ !config().collapsible }}"
      expanded="{{ !config().collapsible }}">
      @if (config().collapsible || config().title) {
        <mat-expansion-panel-header>
          <mat-panel-title>
            <h1 class="title">
              {{ config().title }}
            </h1>
          </mat-panel-title>
          @if (config().createTitle !== '') {
            <button
              mat-icon-button
              class="exp-panel-add-element-btn"
              color="accent"
              (click)="createResource($event)"
              [matTooltip]="createLabel()"
              matTooltipPosition="above">
              <mat-icon color="accent">add_circle</mat-icon>
            </button>
          }
        </mat-expansion-panel-header>
      } @else {
        <div class="no-title-exp-panel-padding"></div>
      }

      <ng-container *ngTemplateOutlet="resourceComponents"></ng-container>
    </mat-expansion-panel>
  </div>
} @else {
  <ng-container *ngTemplateOutlet="resourceComponents"></ng-container>
}

<ng-template #resourceComponents>
  @if (listReady()) {
    <impulse-resource-list
      #list
      [viewRoute]="rootConfig().routeData.route"
      [resourceConfig]="config()"
      [filter]="filter()"
      [hideCreateButton]="false"
      [relatedData]="parentData()"
      [parentId]="parentId()"
      [isRootList]="isRootList()"
      (createRequested)="openCreate()"
      (methodRan)="methodRan()"
      [compoundResourceComponent]="compoundResourceComponent()">
    </impulse-resource-list>
  }

  <!-- The lists the page names under its own: each a list of its own, with its own rows. -->
  @for (under of below(); track $index) {
    <impulse-resource-list-create
      class="below"
      [resourceConfig]="under"
      [isRootList]="false"
      [compoundResourceComponent]="compoundResourceComponent()">
    </impulse-resource-list-create>
  }
</ng-template>
