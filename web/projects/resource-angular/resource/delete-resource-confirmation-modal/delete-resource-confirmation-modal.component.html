<div mat-dialog-title>Delete</div>
<mat-dialog-content>
  <p class="question">{{ question }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-raised-button type="button" color="warn" class="cancel" [mat-dialog-close]="false">Cancel</button>
  <button mat-raised-button type="button" color="accent" class="delete" [mat-dialog-close]="true">Delete</button>
</mat-dialog-actions>
