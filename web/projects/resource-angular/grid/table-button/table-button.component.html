<span
  [matTooltip]="disabled() ? config().disabledLabel : config().label"
  [matTooltipPosition]="tooltipPosition()"
  class="parent">
  @if (config().actionType === 'link') {
    <a
      mat-icon-button
      [routerLink]="viewRoute()"
      [disabled]="disabled()"
      [color]="config().color"
      [attr.aria-label]="config().label">
      <mat-icon>{{ config().icon }}</mat-icon>
    </a>
  } @else if (config().actionType === 'function') {
    <button
      mat-icon-button
      (click)="callAction()"
      [disabled]="disabled()"
      [color]="color()"
      [attr.aria-label]="config().label">
      <mat-icon>{{ config().icon }}</mat-icon>
    </button>
  }
</span>
