<h2 mat-dialog-title>History of {{ flag.words }}</h2>
<mat-dialog-content>
  @if (error(); as message) {
    <p class="feature-flag-history-error" role="alert">{{ message }}</p>
  }
  @if (history()) {
    @if (unseen(); as words) {
      <p class="feature-flag-history-unseen">{{ words }}</p>
    } @else {
      <impulse-grid [rowData]="rows()" [columnDefs]="columns()" [sortable]="false" [emptyMessage]="empty" />
      @if (leftOut(); as note) {
        <p class="feature-flag-history-note">{{ note }}</p>
      }
    }
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Close</button>
</mat-dialog-actions>
