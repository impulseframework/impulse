# One configuration for the framework module. It is the union of the configurations the
# packages carried as modules of their own, each path rule prefixed with the package's
# directory and each linter that only some modules enabled scoped to their directories by
# a path rule, so every package keeps the lint posture it had; the strictest value wins
# where two disagreed. Lodestar and the skeleton candidates keep their own configurations,
# since they are not this module.
version: '2'
linters:
  default: none
  enable:
  - asciicheck
  - bodyclose
  - copyloopvar
  - cyclop
  - depguard
  - dogsled
  - durationcheck
  - errcheck
  - errorlint
  - exhaustive
  - exhaustruct
  - forcetypeassert
  - funlen
  - gochecknoglobals
  - gochecknoinits
  - gocognit
  - goconst
  - gocritic
  - gocyclo
  - godox
  - gomoddirectives
  - goprintffuncname
  - gosec
  - govet
  - importas
  - ineffassign
  - lll
  - makezero
  - misspell
  - nakedret
  - nestif
  - nilerr
  - nlreturn
  - noctx
  - nolintlint
  - paralleltest
  - prealloc
  - predeclared
  - revive
  - rowserrcheck
  - sqlclosecheck
  - staticcheck
  - tagalign
  - tagliatelle
  - tparallel
  - unconvert
  - unparam
  - unused
  - wastedassign
  - whitespace
  - wrapcheck
