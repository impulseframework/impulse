    dupl:
      threshold: 100
    exhaustive:
      default-signifies-exhaustive: true
    funlen:
      lines: 100
      statements: 50
    gocognit:
      min-complexity: 50
    goconst:
      min-len: 2
      min-occurrences: 3
    gocritic:
      enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style
    gocyclo:
      min-complexity: 25
    godox:
      keywords:
      - TODO
      - BUG
    lll:
      line-length: 200
    misspell:
      locale: US
      ignore-rules:
      - cancelled
    nestif:
      min-complexity: 10
    tagliatelle:
      case:
        rules:
          json: camel
        use-field-name: true
        ignored-fields:
        - IDs
    wrapcheck:
      ignore-sigs:
      - .Errorf(
      - errors.New(
      - errors.Unwrap(
      - .Wrap(
      - .Wrapf(
      - .WithMessage(
      - .WithMessagef(
      - .Cause(
      - .RetryableError(
      - sessioninfo.NewLoginRefusal(
      - sessioninfo.NewTooManyAttemptsRefusal(
      - sessioninfo.NewTooManyEmailsRefusal(
      - signinflow.Refusal(
      - .WithDescription(
      - .WithParent(
      ignore-package-globs:
      - github.com/impulseframework/impulse/httpio*
      - github.com/impulseframework/impulse/cmd/impulse/*
      - github.com/impulseframework/impulse/app
      - github.com/impulseframework/impulse/ci
      - github.com/impulseframework/impulse/deployhook
      - github.com/impulseframework/impulse/cast
      - github.com/impulseframework/impulse/session/internal/sessioncore
    gosec:
      config:
        G306: '0644'
        G302: '0644'
    tagalign:
      order:
      - json
      - spanner
    exhaustruct:
      exclude:
      - github.com/spf13/cobra.Command
      - github.com/sethvargo/go-envconfig.Config
    revive:
      rules:
      - name: exported
        severity: warning
        arguments:
        - check-public-interface
        - disable-checks-on-constants
        - disable-checks-on-functions
        - disable-checks-on-methods
        - disable-checks-on-types
        - disable-checks-on-variables
